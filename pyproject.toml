[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "image23mf"
version = "0.1.0"
description = "Nozzle-aware image preparation and Bambu-ready 3MF generation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.104,<1",
  "numpy>=1.26,<2.1",
  "Pillow>=10,<12",
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.1,<3",
  "triangle==20250106",
  "uvicorn[standard]>=0.24,<1",
]

[project.scripts]
image23mf-studio = "image23mf.macos.launcher:main"
image23mf-macos = "image23mf.macos.install:main"
image23mf-workspace = "image23mf.workspace_bundle_cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.100,<7",
  "httpx>=0.25,<1",
  "pytest>=7.4,<9",
  "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/image23mf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
