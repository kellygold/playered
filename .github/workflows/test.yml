name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install development dependencies
        run: make bootstrap
      - name: Build required vectorizer from included source
        run: |
          echo "be8248a17dedd6ccbaab2fcc45835bb0502d062e40fbded3bc56028ce5eb7acc  packaging/macos/vendor/potrace-1.16.tar.gz" | shasum -a 256 -c -
          tar -xzf packaging/macos/vendor/potrace-1.16.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/potrace-1.16"
          ./configure --disable-shared
          make -j 3
          ./src/potrace --version
          echo "$RUNNER_TEMP/potrace-1.16/src" >> "$GITHUB_PATH"
      - name: Check software and build packages
        run: make check
      # Installed Bambu Studio and real-browser release journeys run separately.
      # A green software job does not claim physical-print certification.
